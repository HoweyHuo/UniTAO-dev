name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# main 上的构建串行执行：清理步骤只在本次推送完成后运行，不会碰到另一个正在推送的构建
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from meta_data.json
        id: version
        run: |
          # 检查文件是否存在
          if [ ! -f "docker/meta_data.json" ]; then
            echo "Error: docker/meta_data.json not found"
            exit 1
          fi
          VERSION=$(jq -r '.version' docker/meta_data.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Using version: ${VERSION}"  

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Show generated tags              # 👈 新增调试步骤
        run: |
          echo "Generated tags: ${{ steps.meta.outputs.tags }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/unitao/dockerfile    # 指定 Dockerfile 路径
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 只保留 latest、版本号 tag（x.y.z，冻结的回滚点）及其子 manifest，删除只有 sha tag 的旧构建。
      # 规则见 scripts/cleanup-images.sh；KEEP_RECENT 可多保留最近几个 sha 构建。
      - name: Clean up old images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RECENT: "0"
        run: ./scripts/cleanup-images.sh "${{ github.repository_owner }}" "${{ github.event.repository.name }}"
