# UniTAO Inventory Service 实例。用 script/unitao_deploy.sh 部署：复制本目录到目标目录，生成 .env 和 config/config.json。
# 变量都在 .env（见 .env.template）；COMPOSE_PROJECT_NAME 是 compose 项目名。
# 加入两个已有的网络：unitao（与 Data Service 用容器名互访）和 MongoDB 所在的网络。Inventory 的记录存在 MongoDB 里。
services:
  inventory:
    image: ${UNITAO_IMAGE:-ghcr.io/howeyhuo/unitao-dev:latest}
    # 每次 docker compose up 都向 registry 确认标签当前指向的镜像，latest 前移后自动下载（只下变了的层）；
    # docker compose restart 和容器自动重启不会下载
    pull_policy: always
    container_name: ${UNITAO_NAME:?set UNITAO_NAME in .env}
    restart: always
    user: "${UNITAO_UID:-0}:${UNITAO_GID:-0}"
    environment:
      HOME: /tmp
    volumes:
      - ./config:/opt/UniTAO/config
      - ./logs:/opt/UniTAO/log
    ports:
      - "${UNITAO_PORT:-8000}:80"
    networks: [unitao, mongodb]
    command: "InventoryService -config /opt/UniTAO/config/config.json -log /opt/UniTAO/log"

networks:
  unitao:
    name: ${UNITAO_NETWORK:-unitao_net}
    external: true
  mongodb:
    name: ${UNITAO_MONGODB_NETWORK:-mongo_net}
    external: true
