# 两个相互隔离的网络：siteA 共享 catalog，siteB 镜像它。两边只通过 ./exchange 目录（dir 通道）交换数据。
# 先运行 ./setup.sh 生成签名密钥、SiteB 的配置、.env（当前用户的 UID/GID）。
# UniTAO 容器以该用户运行，写出的 exchange、state.json、日志都归当前用户，可以直接删除；./clean.sh 清理全部生成文件。
services:
  # 两个 site 共用一个 MongoDB，各用自己的 database（SiteA / SiteB）。数据放在 tmpfs 里，容器删除即清空。
  # 账号只用于这个演示；MongoDB 后端总是带账号认证连接，所以要设 root 账号。
  mongodb:
    image: mongo:latest
    container_name: sm-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [siteA, siteB]

  site-a-ds:
    image: ${UNITAO_IMAGE:-ghcr.io/howeyhuo/unitao-dev:latest}
    container_name: sm-site-a-ds
    restart: always
    user: "${UNITAO_UID:-0}:${UNITAO_GID:-0}"
    environment:
      HOME: /tmp
    volumes:
      - ./SiteA/ds:/opt/UniTAO/config
      - ./keys/siteA:/opt/UniTAO/keys:ro
      - ./exchange:/opt/UniTAO/exchange
      - ./logs:/opt/UniTAO/log
    ports:
      - "8011:80"
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [siteA]
    command: "DataService -id SiteA -config /opt/UniTAO/config/config.json -log /opt/UniTAO/log"

  site-a-inv:
    image: ${UNITAO_IMAGE:-ghcr.io/howeyhuo/unitao-dev:latest}
    container_name: sm-site-a-inv
    restart: always
    user: "${UNITAO_UID:-0}:${UNITAO_GID:-0}"
    environment:
      HOME: /tmp
    volumes:
      - ./SiteA/inv:/opt/UniTAO/config
      - ./logs:/opt/UniTAO/log
    ports:
      - "8014:80"
    networks: [siteA]
    command: "InventoryService -config /opt/UniTAO/config/config.json -log /opt/UniTAO/log"

  site-b-ds:
    image: ${UNITAO_IMAGE:-ghcr.io/howeyhuo/unitao-dev:latest}
    container_name: sm-site-b-ds
    restart: always
    user: "${UNITAO_UID:-0}:${UNITAO_GID:-0}"
    environment:
      HOME: /tmp
    volumes:
      - ./SiteB/ds:/opt/UniTAO/config
      - ./keys/siteB:/opt/UniTAO/keys:ro
      # mirror 也要写：它把自己的处理进度写进 exchange/catalog/subscribers/
      - ./exchange:/opt/UniTAO/exchange
      - ./logs:/opt/UniTAO/log
    ports:
      - "8021:80"
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [siteB]
    command: "DataService -id SiteB -config /opt/UniTAO/config/config.json -log /opt/UniTAO/log"

  site-b-inv:
    image: ${UNITAO_IMAGE:-ghcr.io/howeyhuo/unitao-dev:latest}
    container_name: sm-site-b-inv
    restart: always
    user: "${UNITAO_UID:-0}:${UNITAO_GID:-0}"
    environment:
      HOME: /tmp
    volumes:
      - ./SiteB/inv:/opt/UniTAO/config
      - ./logs:/opt/UniTAO/log
    ports:
      - "8024:80"
    networks: [siteB]
    command: "InventoryService -config /opt/UniTAO/config/config.json -log /opt/UniTAO/log"

networks:
  siteA: {}
  siteB: {}
