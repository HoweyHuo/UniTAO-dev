# 两个相互隔离的网络：siteA 共享 catalog，siteB 镜像它。两边只通过 ./exchange 目录（dir 通道）交换数据。
# 启动前按 README 的 Setup 手工准备：两边的 Data Service 配置（MongoDB 地址与账号）、两边的密钥、互相交换的公钥与指纹、SiteB 的配置、.env（当前用户的 UID/GID）。
# UniTAO 容器以该用户运行，写出的 exchange、state.json、日志都归当前用户，可以直接删除（见 README 的 Clean up）。
services:
  site-a-ds:
    image: ${UNITAO_IMAGE:-ghcr.io/howeyhuo/unitao-dev:latest}
    container_name: sm-site-a-ds
    restart: always
    user: "${UNITAO_UID:-0}:${UNITAO_GID:-0}"
    environment:
      HOME: /tmp
    volumes:
      - ./SiteA/ds:/opt/UniTAO/config
      - ./keys/siteA:/opt/UniTAO/keys:ro
      - ./exchange:/opt/UniTAO/exchange
      - ./logs:/opt/UniTAO/log
    ports:
      - "8011:80"
    networks: [siteA, mongodb]
    command: "DataService -id SiteA -config /opt/UniTAO/config/config.json -log /opt/UniTAO/log"

  site-a-inv:
    image: ${UNITAO_IMAGE:-ghcr.io/howeyhuo/unitao-dev:latest}
    container_name: sm-site-a-inv
    restart: always
    user: "${UNITAO_UID:-0}:${UNITAO_GID:-0}"
    environment:
      HOME: /tmp
    volumes:
      - ./SiteA/inv:/opt/UniTAO/config
      - ./logs:/opt/UniTAO/log
    ports:
      - "8014:80"
    networks: [siteA]
    command: "InventoryService -config /opt/UniTAO/config/config.json -log /opt/UniTAO/log"

  site-b-ds:
    image: ${UNITAO_IMAGE:-ghcr.io/howeyhuo/unitao-dev:latest}
    container_name: sm-site-b-ds
    restart: always
    user: "${UNITAO_UID:-0}:${UNITAO_GID:-0}"
    environment:
      HOME: /tmp
    volumes:
      - ./SiteB/ds:/opt/UniTAO/config
      - ./keys/siteB:/opt/UniTAO/keys:ro
      # mirror 也要写：它把自己的处理进度写进 exchange/catalog/subscribers/
      - ./exchange:/opt/UniTAO/exchange
      - ./logs:/opt/UniTAO/log
    ports:
      - "8021:80"
    networks: [siteB, mongodb]
    command: "DataService -id SiteB -config /opt/UniTAO/config/config.json -log /opt/UniTAO/log"

  site-b-inv:
    image: ${UNITAO_IMAGE:-ghcr.io/howeyhuo/unitao-dev:latest}
    container_name: sm-site-b-inv
    restart: always
    user: "${UNITAO_UID:-0}:${UNITAO_GID:-0}"
    environment:
      HOME: /tmp
    volumes:
      - ./SiteB/inv:/opt/UniTAO/config
      - ./logs:/opt/UniTAO/log
    ports:
      - "8024:80"
    networks: [siteB]
    command: "InventoryService -config /opt/UniTAO/config/config.json -log /opt/UniTAO/log"

networks:
  siteA: {}
  siteB: {}
  # MongoDB 不在这个 compose 里：Data Service 加入它所在的已有网络（docker network ls），按 README 的 Setup 填好 config 里的地址和账号
  mongodb:
    name: ${UNITAO_MONGODB_NETWORK:-mongo_net}
    external: true
