# 两个相互隔离的网络：site-shared 共享 catalog，site-mirror 镜像它。两边只通过 ./exchange 目录（dir 通道）交换数据。
# 启动前按 README 的 Setup 手工准备：两边 Data Service 的配置（MongoDB 地址与账号）、两边的密钥、互相交换的公钥与指纹、.env（当前用户的 UID/GID）。
# UniTAO 容器以该用户运行，写出的 exchange、state.json、日志都归当前用户（见 README 的 Clean up）。
services:
  site-shared-ds:
    image: ${UNITAO_IMAGE:-ghcr.io/howeyhuo/unitao-dev:latest}
    container_name: sm-site-shared-ds
    restart: always
    user: "${UNITAO_UID:-0}:${UNITAO_GID:-0}"
    environment:
      HOME: /tmp
    volumes:
      # config.json、state.json、ssh/、密钥
      - ./site-shared/ds/config:/opt/UniTAO/config
      # 通道的中间文件（git 通道的 workDir 克隆；dir 通道没有）
      - ./site-shared/ds/data:/opt/UniTAO/data
      - ./exchange:/opt/UniTAO/exchange
      - ./logs:/opt/UniTAO/log
    ports:
      - "8011:80"
    networks: [site-shared, mongodb]
    command: "DataService -id site-shared -config /opt/UniTAO/config/config.json -log /opt/UniTAO/log"

  site-shared-inv:
    image: ${UNITAO_IMAGE:-ghcr.io/howeyhuo/unitao-dev:latest}
    container_name: sm-site-shared-inv
    restart: always
    user: "${UNITAO_UID:-0}:${UNITAO_GID:-0}"
    environment:
      HOME: /tmp
    volumes:
      - ./site-shared/inv/config:/opt/UniTAO/config
      # Inventory 的记录（sysdirfile）
      - ./site-shared/inv/data:/opt/UniTAO/data
      - ./logs:/opt/UniTAO/log
    ports:
      - "8014:80"
    networks: [site-shared]
    command: "InventoryService -config /opt/UniTAO/config/config.json -log /opt/UniTAO/log"

  site-mirror-ds:
    image: ${UNITAO_IMAGE:-ghcr.io/howeyhuo/unitao-dev:latest}
    container_name: sm-site-mirror-ds
    restart: always
    user: "${UNITAO_UID:-0}:${UNITAO_GID:-0}"
    environment:
      HOME: /tmp
    volumes:
      # config.json、state.json、ssh/、密钥
      - ./site-mirror/ds/config:/opt/UniTAO/config
      # 通道的中间文件（git 通道的 workDir 克隆；dir 通道没有）
      - ./site-mirror/ds/data:/opt/UniTAO/data
      # mirror 也要写：它把自己的处理进度写进 exchange/catalog/subscribers/
      - ./exchange:/opt/UniTAO/exchange
      - ./logs:/opt/UniTAO/log
    ports:
      - "8021:80"
    networks: [site-mirror, mongodb]
    command: "DataService -id site-mirror -config /opt/UniTAO/config/config.json -log /opt/UniTAO/log"

  site-mirror-inv:
    image: ${UNITAO_IMAGE:-ghcr.io/howeyhuo/unitao-dev:latest}
    container_name: sm-site-mirror-inv
    restart: always
    user: "${UNITAO_UID:-0}:${UNITAO_GID:-0}"
    environment:
      HOME: /tmp
    volumes:
      - ./site-mirror/inv/config:/opt/UniTAO/config
      # Inventory 的记录（sysdirfile）
      - ./site-mirror/inv/data:/opt/UniTAO/data
      - ./logs:/opt/UniTAO/log
    ports:
      - "8024:80"
    networks: [site-mirror]
    command: "InventoryService -config /opt/UniTAO/config/config.json -log /opt/UniTAO/log"

networks:
  site-shared: {}
  site-mirror: {}
  # MongoDB 不在这个 compose 里：Data Service 加入它所在的已有网络（docker network ls），按 README 的 Setup 填好 config 里的地址和账号
  mongodb:
    name: ${UNITAO_MONGODB_NETWORK:-mongo_net}
    external: true
