# site-shared：发布 shared/catalog。与 site-mirror 是两个独立的部署，只通过一个 git 仓库（git 通道）交换数据。
# 这里用宿主机上的裸仓库 ../remote/exchange.git 充当远端，以 file:// 访问，不需要 SSH；
# 实际部署把 channel.repo 换成两边都能访问的 git 服务器地址，并去掉 ../remote 的挂载。
# 启动前按 ../README.md 的 Setup 手工准备：本 site Data Service 的配置（MongoDB 地址与账号）、密钥、从另一 site 拿到的公钥或指纹、.env（当前用户的 UID/GID）。
# UniTAO 容器以该用户运行，写出的文件都归当前用户（见 README 的 Clean up）。
name: sm-site-shared
# 服务名带 site 前缀：Data Service 还在 mongo_net 上，那里另一个 site 的同名服务会让 DNS 解析到错误的容器

services:
  site-shared-ds:
    image: ${UNITAO_IMAGE:-ghcr.io/howeyhuo/unitao-dev:latest}
    container_name: sm-site-shared-ds
    restart: always
    user: "${UNITAO_UID:-0}:${UNITAO_GID:-0}"
    environment:
      HOME: /tmp
    volumes:
      # config.json、state.json、ssh/、密钥
      - ./ds/config:/opt/UniTAO/config
      # 通道的中间文件（git 通道的 workDir 克隆；dir 通道没有）
      - ./ds/data:/opt/UniTAO/data
      # 远端仓库：发布方要 push，可写
      - ../remote:/opt/UniTAO/remote
      - ./logs:/opt/UniTAO/log
    ports:
      - "8031:80"
    networks: [default, mongodb]
    command: "DataService -id site-shared -config /opt/UniTAO/config/config.json -log /opt/UniTAO/log"

  site-shared-inv:
    image: ${UNITAO_IMAGE:-ghcr.io/howeyhuo/unitao-dev:latest}
    container_name: sm-site-shared-inv
    restart: always
    user: "${UNITAO_UID:-0}:${UNITAO_GID:-0}"
    environment:
      HOME: /tmp
    volumes:
      - ./inv/config:/opt/UniTAO/config
      # Inventory 的记录（sysdirfile）
      - ./inv/data:/opt/UniTAO/data
      - ./logs:/opt/UniTAO/log
    ports:
      - "8034:80"
    command: "InventoryService -config /opt/UniTAO/config/config.json -log /opt/UniTAO/log"

networks:
  # MongoDB 不在这个 compose 里：Data Service 加入它所在的已有网络（docker network ls），按 README 的 Setup 填好 config 里的地址和账号
  mongodb:
    name: ${UNITAO_MONGODB_NETWORK:-mongo_net}
    external: true
